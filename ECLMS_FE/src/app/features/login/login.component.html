<div class="login-page">
  <div class="login-card glass">
    <div class="login-header">
      <i class='bx bx-hive logo-icon'></i>
      <h2>Welcome to ECLMS</h2>
      <p>Enterprise Contract Lifecycle Management System</p>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div *ngIf="errorMessage" class="alert alert-danger">
        <i class='bx bx-error-circle'></i>
        <span>{{ errorMessage }}</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <div class="input-wrapper">
          <i class='bx bx-user input-icon'></i>
          <input 
            type="text" 
            id="username" 
            name="username" 
            class="form-control" 
            placeholder="Enter your username" 
            [(ngModel)]="credentials.username" 
            required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrapper">
          <i class='bx bx-lock-alt input-icon'></i>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-control" 
            placeholder="Enter your password" 
            [(ngModel)]="credentials.password" 
            required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="isLoading">
        <span *ngIf="isLoading"><i class='bx bx-loader-alt bx-spin'></i> Authenticating...</span>
        <span *ngIf="!isLoading">Sign In</span>
      </button>
    </form>

    <div class="login-footer">
      Don't have an account? <a routerLink="/register" class="register-link">Register here</a>
    </div>
  </div>
</div>
