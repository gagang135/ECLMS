<div class="register-page">
  <div class="register-card glass">
    <div class="register-header">
      <i class='bx bx-hive logo-icon'></i>
      <h2>Create Account</h2>
      <p>Sign up to get access to ECLMS</p>
    </div>

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
      <div *ngIf="errorMessage" class="alert alert-danger">
        <i class='bx bx-error-circle'></i>
        <span>{{ errorMessage }}</span>
      </div>

      <div *ngIf="successMessage" class="alert alert-success">
        <i class='bx bx-check-circle'></i>
        <span>{{ successMessage }}</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="fullName">Full Name</label>
        <div class="input-wrapper">
          <i class='bx bx-user-circle input-icon'></i>
          <input 
            type="text" 
            id="fullName" 
            name="fullName" 
            class="form-control" 
            placeholder="John Doe" 
            [(ngModel)]="user.fullName" 
            required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <div class="input-wrapper">
          <i class='bx bx-user input-icon'></i>
          <input 
            type="text" 
            id="username" 
            name="username" 
            class="form-control" 
            placeholder="johndoe" 
            [(ngModel)]="user.username" 
            required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <div class="input-wrapper">
          <i class='bx bx-envelope input-icon'></i>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-control" 
            placeholder="john@example.com" 
            [(ngModel)]="user.email" 
            required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrapper">
          <i class='bx bx-lock-alt input-icon'></i>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-control" 
            placeholder="Create password" 
            [(ngModel)]="user.password" 
            required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="isLoading">
        <span *ngIf="isLoading"><i class='bx bx-loader-alt bx-spin'></i> Submitting...</span>
        <span *ngIf="!isLoading">Register</span>
      </button>
    </form>

    <div class="register-footer">
      Already have an account? <a routerLink="/login" class="login-link">Sign In</a>
    </div>
  </div>
</div>
