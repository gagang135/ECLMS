# Server configuration
server.port=${PORT:8082}
server.error.include-message=always
server.error.include-binding-errors=always

# Spring Core
spring.application.name=eclms
spring.profiles.active=dev

# Oracle Data Source
spring.datasource.url=jdbc:mysql://localhost:3306/eclms?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration/mysql

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.time-to-live=3600000

# Elasticsearch
spring.data.elasticsearch.repositories.enabled=true
spring.data.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}
spring.data.elasticsearch.socket-timeout=30s
spring.data.elasticsearch.connection-timeout=10s

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.concurrency=2
spring.rabbitmq.listener.simple.max-concurrency=5
spring.rabbitmq.listener.simple.acknowledge-mode=auto

# Multipart Uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Custom ECLMS Parameters
app.security.jwt.secret=${JWT_SECRET:40640a023a564394a94736680172bf3e40640a023a564394a94736680172bf3e40640a023a564394a94736680172bf3e}
app.security.jwt.access-expiration-ms=900000
app.security.jwt.refresh-expiration-ms=604800000
app.security.jwt.otp-expiration-ms=300000
app.security.rate-limit.requests-per-minute=60

app.storage.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.storage.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
app.storage.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
app.storage.minio.bucket-name=${MINIO_BUCKET:eclms-documents}
app.storage.minio.temp-bucket-name=${MINIO_TEMP_BUCKET:eclms-temp}

# Logging levels
logging.level.root=INFO
logging.level.com.company.eclms=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=INFO
